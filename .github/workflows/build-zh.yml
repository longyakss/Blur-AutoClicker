name: Build zh-CN portable

on:
  workflow_dispatch:
  push:
    branches: [zh-CN]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'screenshots/**'
      - '**.png'
      - '**.svg'
      - '**.jpg'

permissions:
  contents: write

jobs:
  build:
    name: Build portable zip (zh-CN)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package portable
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          & "${{ github.workspace }}/scripts/package-portable.ps1" `
            -RepoRoot "${{ github.workspace }}" `
            -Tag "v$version-zh"

      - name: Publish release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $tag = "zh-v$version"
          $zip = (Get-ChildItem "BlurAutoClicker-*portable.zip" | Select-Object -First 1).FullName
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag $zip --repo $env:GITHUB_REPOSITORY --title "$version 简体中文便携版" --notes "自动化构建的简体中文汉化便携版，基于上游 v$version。绿色免安装，解压即用。" --latest
          } else {
            gh release upload $tag $zip --repo $env:GITHUB_REPOSITORY --clobber
          }
